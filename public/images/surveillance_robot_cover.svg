<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-powered surveillance robot cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a192f"/>
      <stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(360 320) rotate(45) scale(560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ffda" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1260 540) rotate(45) scale(560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="120" y1="700" x2="760" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ffda"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cone" x1="1180" y1="430" x2="760" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ffda" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <!-- Control dashboard panel -->
  <g>
    <rect x="140" y="210" width="560" height="470" rx="22" fill="#0e2742" stroke="#64ffda" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="180" cy="248" r="7" fill="#64ffda" fill-opacity="0.8"/>
    <circle cx="204" cy="248" r="7" fill="#3b82f6" fill-opacity="0.7"/>
    <circle cx="228" cy="248" r="7" fill="#8892b0" fill-opacity="0.5"/>
    <text x="560" y="254" font-family="Consolas, monospace" font-size="15" fill="#8892b0">control</text>
    <line x1="140" y1="282" x2="700" y2="282" stroke="#1e3a5f" stroke-width="2"/>

    <!-- live camera feed -->
    <rect x="172" y="312" width="340" height="220" rx="12" fill="#0a192f" stroke="#1e3a5f" stroke-width="2"/>
    <!-- crosshair -->
    <line x1="342" y1="340" x2="342" y2="504" stroke="#64ffda" stroke-opacity="0.25" stroke-width="2"/>
    <line x1="200" y1="422" x2="484" y2="422" stroke="#64ffda" stroke-opacity="0.25" stroke-width="2"/>
    <!-- scan line -->
    <line x1="172" y1="380" x2="512" y2="380" stroke="#64ffda" stroke-opacity="0.5" stroke-width="3"/>
    <!-- detection box -->
    <rect x="372" y="356" width="84" height="140" stroke="#64ffda" stroke-width="2" stroke-dasharray="8 6" fill="none" rx="4"/>
    <!-- LIVE badge -->
    <g transform="translate(190 330)">
      <rect x="0" y="0" width="74" height="26" rx="6" fill="#0a192f" stroke="#ff6b6b" stroke-opacity="0.7"/>
      <circle cx="16" cy="13" r="5" fill="#ff6b6b"/>
      <text x="30" y="18" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ff6b6b">LIVE</text>
    </g>

    <!-- joystick -->
    <g transform="translate(255 605)">
      <circle cx="0" cy="0" r="58" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.4" stroke-width="2"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#1e3a5f" stroke-width="2"/>
      <circle cx="18" cy="-14" r="26" fill="#64ffda" fill-opacity="0.18" stroke="#64ffda" stroke-width="2.5"/>
    </g>

    <!-- telemetry bars -->
    <g transform="translate(380 560)">
      <text x="0" y="0" font-family="Consolas, monospace" font-size="14" fill="#8892b0">telemetry</text>
      <rect x="0" y="16" width="240" height="10" rx="5" fill="#1e3a5f"/><rect x="0" y="16" width="170" height="10" rx="5" fill="#64ffda" fill-opacity="0.7"/>
      <rect x="0" y="38" width="240" height="10" rx="5" fill="#1e3a5f"/><rect x="0" y="38" width="120" height="10" rx="5" fill="#3b82f6" fill-opacity="0.8"/>
      <rect x="0" y="60" width="240" height="10" rx="5" fill="#1e3a5f"/><rect x="0" y="60" width="200" height="10" rx="5" fill="#64ffda" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- real-time link -->
  <g>
    <path d="M760,430 C 860,400 940,400 1010,430" stroke="#64ffda" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
    <g transform="translate(820 350)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#10233f" stroke="#64ffda" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="26" cy="19" r="6" fill="#64ffda"/>
      <text x="44" y="25" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#64ffda">Socket.IO</text>
    </g>
  </g>

  <!-- vision cone from robot -->
  <path d="M1180 440 L760 320 L760 560 Z" fill="url(#cone)"/>

  <!-- surveillance robot -->
  <g>
    <!-- broadcast waves -->
    <path d="M1300,360 A60,60 0 0 0 1300,460" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="2.5" fill="none"/>
    <path d="M1320,340 A90,90 0 0 0 1320,480" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2.5" fill="none"/>
    <!-- mast + camera -->
    <line x1="1230" y1="560" x2="1230" y2="430" stroke="#64ffda" stroke-width="6" stroke-linecap="round"/>
    <rect x="1180" y="392" width="110" height="58" rx="10" fill="#0e2742" stroke="#64ffda" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="1205" cy="421" r="18" fill="#0a192f" stroke="#64ffda" stroke-width="3"/>
    <circle cx="1205" cy="421" r="7" fill="#64ffda"/>
    <circle cx="1262" cy="408" r="5" fill="#ff6b6b"/>
    <!-- body -->
    <rect x="1150" y="556" width="170" height="80" rx="14" fill="#112a4a" stroke="#64ffda" stroke-opacity="0.5" stroke-width="2.5"/>
    <rect x="1172" y="576" width="60" height="16" rx="8" fill="#64ffda" fill-opacity="0.5"/>
    <circle cx="1300" cy="584" r="6" fill="#3b82f6"/>
    <!-- wheels -->
    <circle cx="1180" cy="648" r="26" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="1235" cy="648" r="26" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="1290" cy="648" r="26" fill="#0a192f" stroke="#64ffda" stroke-opacity="0.5" stroke-width="3"/>
    <!-- AI sparkle -->
    <path d="M1360 470 l8 19 19 8 -19 8 -8 19 -8 -19 -19 -8 19 -8 z" fill="#64ffda"/>
  </g>

  <!-- tag -->
  <g transform="translate(120 250)">
    <rect x="0" y="0" width="280" height="44" rx="22" fill="#64ffda" fill-opacity="0.12" stroke="#64ffda" stroke-opacity="0.4"/>
    <circle cx="28" cy="22" r="5" fill="#64ffda"/>
    <text x="48" y="29" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#64ffda" letter-spacing="1">ROBOTICS · ESP32</text>
  </g>

  <text x="120" y="772" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="url(#title)">Surveillance Robot</text>
  <text x="124" y="822" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#8892b0">ESP32 Robot · Browser Joystick Control · Socket.IO · AI Assistant</text>
</svg>
