<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EyeCare healthcare platform thumbnail">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a192f"/>
      <stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0" cy="0" r="1" gradientTransform="translate(600 320) rotate(90) scale(520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ffda" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tiris" cx="0" cy="0" r="1" gradientTransform="translate(600 330) scale(78)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ffda"/>
      <stop offset="1" stop-color="#0e8f86"/>
    </radialGradient>
    <linearGradient id="ttitle" x1="420" y1="640" x2="780" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64ffda"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#tbg)"/>
  <rect width="1200" height="800" fill="url(#tglow)"/>

  <!-- eye -->
  <path d="M420 330 Q600 220 780 330 Q600 440 420 330 Z" fill="#0a192f" stroke="#64ffda" stroke-width="4"/>
  <circle cx="600" cy="330" r="78" fill="url(#tiris)"/>
  <circle cx="600" cy="330" r="32" fill="#0a192f"/>
  <circle cx="624" cy="306" r="12" fill="#ffffff" fill-opacity="0.85"/>

  <!-- medical cross accent -->
  <g transform="translate(792 214)">
    <circle r="34" fill="#10233f" stroke="#64ffda" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="-5" y="-15" width="10" height="30" rx="3" fill="#64ffda"/>
    <rect x="-15" y="-5" width="30" height="10" rx="3" fill="#64ffda"/>
  </g>
  <!-- Rx accent -->
  <g transform="translate(404 214)">
    <circle r="34" fill="#10233f" stroke="#64ffda" stroke-opacity="0.55" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#64ffda">Rx</text>
  </g>

  <text x="600" y="640" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#ttitle)">EyeCare</text>
  <text x="600" y="682" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#8892b0">Eye-Care Healthcare Platform</text>
</svg>
