    <g>
      <rect x="330" y="270" width="120" height="14" rx="7" fill="#64ffda" fill-opacity="0.85"/>
      <rect x="462" y="270" width="170" height="14" rx="7" fill="#ccd6f6" fill-opacity="0.65"/>
      <rect x="360" y="306" width="90" height="14" rx="7" fill="#3b82f6" fill-opacity="0.8"/>
      <rect x="462" y="306" width="230" height="14" rx="7" fill="#ccd6f6" fill-opacity="0.5"/>
      <rect x="360" y="342" width="260" height="14" rx="7" fill="#ccd6f6" fill-opacity="0.55"/>
      <rect x="390" y="378" width="160" height="14" rx="7" fill="#64ffda" fill-opacity="0.7"/>
      <rect x="562" y="378" width="120" height="14" rx="7" fill="#ccd6f6" fill-opacity="0.5"/>
